name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests and verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: No runtime dependencies
        run: |
          if [ -d node_modules ]; then echo "node_modules must not be committed"; exit 1; fi
          node -e "const p=require('./package.json');if(p.dependencies&&Object.keys(p.dependencies).length){console.error('runtime dependencies are not allowed');process.exit(1)}"

      - name: Tests and verification
        run: npm run ci
