name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify before publishing
        run: npm run ci

      - name: Stage the static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r src _site/
          cp README.md _site/ 2>/dev/null || true

      # Turn Pages on if it is not already. Without this the very first
      # deploy of a fresh repository fails on "Get Pages site failed", which
      # is a repository-settings problem wearing the costume of a build failure.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
