<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brackenfall: The Long Hush</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Brackenfall: The Long Hush - an original top-down action-adventure. Relight two wick-stones before the valley goes quiet.">
<meta name="theme-color" content="#0b1310">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brackenfall">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
  :root {
    --ink: #0b1310;
    --dark: #2f5245;
    --mid: #78a68c;
    --light: #dfeedb;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--ink);
    color: var(--light);
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    /* No scrolling, no pinch-zoom, no double-tap zoom while playing. */
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #shell {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 8px;
  }
  canvas#screen {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: var(--light);
    border: 2px solid var(--dark);
  }
  #controls {
    width: 100%;
    max-width: 420px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    gap: 12px;
  }
  #controls.hidden { display: none; }
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 44px);
    grid-template-rows: repeat(3, 44px);
    justify-content: start;
  }
  .face {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 12px;
  }
  .btn {
    background: var(--dark);
    color: var(--light);
    border: 2px solid var(--mid);
    border-radius: 8px;
    font: inherit;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
  }
  .btn:active { background: var(--mid); color: var(--ink); }
  .round { width: 52px; height: 52px; border-radius: 50%; font-size: 18px; }
  .start { width: 76px; height: 30px; font-size: 12px; border-radius: 15px; }
  .pad-u { grid-area: 1 / 2; } .pad-l { grid-area: 2 / 1; }
  .pad-r { grid-area: 2 / 3; } .pad-d { grid-area: 3 / 2; }
  .pad-c { grid-area: 2 / 2; background: var(--dark); border: 2px solid var(--mid); }
  .hint {
    font-size: 11px;
    color: var(--mid);
    text-align: center;
    line-height: 1.5;
  }
  /* Sound is not a game control - it is not on the pad, and it never feeds
     the button mask. The game is still played with a d-pad and two buttons. */
  #mute {
    height: 26px;
    padding: 0 12px;
    font-size: 11px;
    border-radius: 13px;
  }
  @media (hover: hover) and (pointer: fine) {
    #controls { display: none; }
  }
  /* The installable-app banners (src/pwa.js). Drawn over the page, never in
     the layout, so the canvas never resizes when one comes or goes. */
  .banner {
    position: fixed;
    top: calc(8px + env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 16px);
    max-width: 420px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: var(--ink);
    color: var(--light);
    border: 2px solid var(--mid);
    border-radius: 8px;
    font-size: 11px;
    line-height: 1.5;
    touch-action: manipulation;
  }
  .banner[hidden], .banner [hidden] { display: none; }
  .banner .msg { flex: 1; }
  .banner .btn { height: 26px; padding: 0 10px; font-size: 11px; border-radius: 13px; flex: none; }
  .banner .btn.plain { background: transparent; border-color: var(--dark); }
</style>
</head>
<body>
<main id="shell">
  <canvas id="screen" width="160" height="144" aria-label="Brackenfall game screen"></canvas>

  <div id="controls">
    <div class="dpad">
      <button class="btn pad-u" data-btn="UP" aria-label="up">&#9650;</button>
      <button class="btn pad-l" data-btn="LEFT" aria-label="left">&#9664;</button>
      <div class="pad-c"></div>
      <button class="btn pad-r" data-btn="RIGHT" aria-label="right">&#9654;</button>
      <button class="btn pad-d" data-btn="DOWN" aria-label="down">&#9660;</button>
    </div>
    <div class="face">
      <button class="btn start" data-btn="START">START</button>
      <button class="btn round" data-btn="B">B</button>
      <button class="btn round" data-btn="A">A</button>
    </div>
  </div>

  <p class="hint">
    ARROWS / WASD move &nbsp;&middot;&nbsp; Z = A (sword, talk) &nbsp;&middot;&nbsp; X = B (jump) &nbsp;&middot;&nbsp; ENTER = START
  </p>
  <button id="mute" class="btn" type="button" aria-pressed="false">&#9834; SOUND ON</button>
</main>
<div id="pwa-install" class="banner" role="region" aria-label="Install" hidden>
  <span class="msg" data-pwa="message">INSTALL BRACKENFALL TO PLAY FULL SCREEN, EVEN OFFLINE.</span>
  <button class="btn" type="button" data-pwa="install">INSTALL</button>
  <button class="btn plain" type="button" data-pwa="dismiss" aria-label="Dismiss">&#10005;</button>
</div>
<div id="pwa-update" class="banner" role="status" hidden>
  <span class="msg">A NEW VERSION IS READY.</span>
  <button class="btn" type="button" data-pwa="reload">RELOAD</button>
  <button class="btn plain" type="button" data-pwa="later">LATER</button>
</div>
<script type="module" src="./src/main.js"></script>
<script type="module" src="./src/pwa.js"></script>
</body>
</html>
